server:
  port: 5301
  address: 0.0.0.0

spring:
  application:
    name: paiyucun

  datasource:
    url: jdbc:mysql://localhost:3306/paiyucun?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 应用自定义配置
app:
  upload-path: D:/董庆玮/古诗词/paiyucun/backend/uploads

  # AI 识别提供方
  ai:
    # mock=模拟识别 | vision=调用真实视觉模型（OpenAI 兼容）
    provider: vision
    # OpenAI 兼容接口地址（通义千问/智谱 GLM/Kimi 等）
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # 从环境变量 DASHSCOPE_API_KEY 读取，勿硬编码或提交到 Git
    api-key: ${DASHSCOPE_API_KEY:}
    # 视觉模型名
    model: qwen-vl-plus
    # 请求超时（毫秒）
    timeout-ms: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.paiyucun: debug
